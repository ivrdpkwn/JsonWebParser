<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JsonWebParser</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>JSON Web Parser</h1>
        <p>C++ Backend • httplib • nlohmann/json</p>
    </header>

    <main>

        <!-- Input -->
        <section class="input-section">

            <div class="section-header">
                <label for="input">输入 JSON</label>

                <button id="uploadBtn" class="btn btn-secondary">
                    上传
                </button>
            </div>

            <div class="editor-container">

                <textarea
                    id="input"
                    placeholder='{"name":"Sliys","age":20}'
                ></textarea>

                <button id="formatBtn" class="btn btn-primary">
                    格式化
                </button>

                <input
                    type="file"
                    id="fileInput"
                    accept=".json"
                    hidden
                />

            </div>

        </section>

        <!-- Output -->
        <section class="output-section">

            <div class="section-header">

                <label>解析结果</label>

                <button id="downloadBtn" class="btn btn-secondary">
                    下载
                </button>

            </div>

            <div id="result" class="json-viewer"></div>

        </section>

    </main>

    <footer>
        JsonWebParser • Built with C++ & Vanilla JS
    </footer>

</div>

<script defer src="/js/script.js"></script>

</body>
</html>
