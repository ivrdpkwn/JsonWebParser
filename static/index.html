<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JsonWebParser</title>

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>JSON Web Parser</h1>
      <p>C++ Backend • httplib • nlohmann/json</p>
    </header>

    <main>
      <!-- Input -->
      <section class="input-section">
        <div class="section-header">
          <label for="input">输入 JSON</label>

          <div style="display:flex;gap:8px;">
            <button id="uploadBtn" class="btn btn-secondary">上传</button>
          </div>
        </div>

        <div class="editor-container">
          <textarea id="input" placeholder='{"name":"Sliys","age":20}'></textarea>

          <button id="formatBtn" class="btn btn-primary">格式化</button>

          <input type="file" id="fileInput" accept=".json" hidden />
        </div>
      </section>

      <!-- Output -->
      <section class="output-section">
        <div class="section-header">
          <label>解析结果</label>
          <div style="display:flex;gap:8px;align-items:center">
            <button id="downloadBtn" class="btn btn-secondary">下载</button>
            <!-- 可选： 全部折叠/全部展开（UI 保留，可在将来启用） -->
            <button id="collapseAllBtn" class="btn btn-secondary" title="折叠所有">折叠</button>
            <button id="expandAllBtn" class="btn btn-secondary" title="展开所有">展开</button>
          </div>
        </div>

        <!-- JSON 渲染容器（高亮 + 折叠） -->
        <div id="result" class="json-viewer" aria-live="polite" role="region"></div>

        <!-- 错误信息 / 简短文本输出（和 result 分离，避免覆盖） -->
        <div id="output" style="margin-top:8px;"></div>
      </section>
    </main>

    <footer>
      JsonWebParser • Built with C++ & Vanilla JS
    </footer>
  </div>

  <script defer src="/js/script.js"></script>
</body>
</html>
